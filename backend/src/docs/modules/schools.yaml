/schools:
  post:
    tags:
    - Schools
    summary: Create school with admin
    description: Create a new school and its admin user (Super Admin only)
    operationId: createSchool
    security:
    - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateSchoolRequest'
    responses:
      '201':
        description: School created successfully
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Success'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      school:
                        $ref: '#/components/schemas/School'
                      admin:
                        $ref: '#/components/schemas/User'
      '400':
        $ref: '#/components/responses/ValidationError'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '409':
        description: School code or admin email already exists
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        $ref: '#/components/responses/InternalServerError'
  get:
    tags:
    - Schools
    summary: Get all schools
    description: Retrieve list of all schools (Super Admin only)
    operationId: getAllSchools
    security:
    - BearerAuth: []
    responses:
      '200':
        description: Schools retrieved successfully
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Success'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/School'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '500':
        $ref: '#/components/responses/InternalServerError'
/schools/{id}:
  get:
    tags:
    - Schools
    summary: Get school by ID
    description: Retrieve school details by ID (Super Admin or School Admin)
    operationId: getSchoolById
    security:
    - BearerAuth: []
    parameters:
    - $ref: '#/components/parameters/IdPathParam'
    responses:
      '200':
        description: School retrieved successfully
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Success'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/School'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
      '500':
        $ref: '#/components/responses/InternalServerError'
  patch:
    tags:
    - Schools
    summary: Update school
    description: Update school details (Super Admin only)
    operationId: updateSchool
    security:
    - BearerAuth: []
    parameters:
    - $ref: '#/components/parameters/IdPathParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateSchoolRequest'
          examples:
            updateSubscriptionPlan:
              summary: Update subscription plan
              value:
                subscriptionPlanId: 3
                subscriptionStatus: active
            updateContactInfo:
              summary: Update contact information
              value:
                contactEmail: newcontact@abcschool.com
                contactPhone: '+9876543210'
    responses:
      '200':
        description: School updated successfully
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Success'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/School'
      '400':
        $ref: '#/components/responses/ValidationError'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
      '500':
        $ref: '#/components/responses/InternalServerError'
/schools/{id}/admin:
  get:
    tags:
    - Schools
    summary: Get school admin details
    description: Retrieve the admin user of a school (Super Admin only)
    operationId: getSchoolAdmin
    security:
    - BearerAuth: []
    parameters:
    - $ref: '#/components/parameters/IdPathParam'
    responses:
      '200':
        description: School admin retrieved successfully
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Success'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
      '500':
        $ref: '#/components/responses/InternalServerError'
  patch:
    tags:
    - Schools
    summary: Update school admin details
    description: Update the admin user details for a school (Super Admin only)
    operationId: updateSchoolAdmin
    security:
    - BearerAuth: []
    parameters:
    - $ref: '#/components/parameters/IdPathParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateSchoolAdminRequest'
          examples:
            updateAdminName:
              summary: Update admin name and phone
              value:
                fullName: John Smith
                phone: '+9876543210'
            updateAdminEmail:
              summary: Update admin email
              value:
                email: newadmin@abcschool.com
            resetAdminPassword:
              summary: Reset admin password
              value:
                password: NewPassword@123
    responses:
      '200':
        description: School admin updated successfully
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Success'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
      '400':
        $ref: '#/components/responses/ValidationError'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
      '500':
        $ref: '#/components/responses/InternalServerError'
