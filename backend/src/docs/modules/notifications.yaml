/notifications/retry-failed:
  post:
    tags:
      - Notifications
    summary: Retry failed notifications
    description: Re-attempt email delivery for all notifications that previously failed. Admin and Super Admin only.
    operationId: retryFailedNotifications
    security:
      - BearerAuth: []
    responses:
      "200":
        description: Retry completed
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Success"
                - type: object
                  properties:
                    data:
                      $ref: "#/components/schemas/BroadcastResult"
            examples:
              success:
                summary: Retry result
                value:
                  success: true
                  message: "Retry completed"
                  data:
                    total: 3
                    retried: 3
                    failed: 0
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
