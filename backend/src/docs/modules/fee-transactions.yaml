/fee-transactions/{id}/payment:
  patch:
    tags:
      - Fee Transactions
    summary: Record fee payment
    description: |
      Record a payment against a fee transaction (School Admin or Accountant).

      - Payments are cumulative — each call adds to `amount_paid`
      - Status auto-updates: `pending` → `partial` → `paid`
      - Overpayment beyond `amount_due` is rejected
      - Paying an already `paid` transaction is rejected

      **Example (quarterly, amount_due = 12,500):**
      - Call 1: amountPaid=6000 → status: `partial`, amount_paid=6000
      - Call 2: amountPaid=6500 → status: `paid`, amount_paid=12500
    security:
      - BearerAuth: []
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RecordPayment'
          examples:
            fullPayment:
              summary: Full term payment
              value:
                amountPaid: 12500.00
                paymentMode: "cash"
                paymentDate: "2024-04-05"
                receiptNumber: "RCP-001"
            partialPayment:
              summary: Partial payment
              value:
                amountPaid: 6000.00
                paymentMode: "upi"
                paymentDate: "2024-04-05"
    responses:
      '200':
        description: Payment recorded successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Success'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/FeeTransaction'
            examples:
              paid:
                summary: Fully paid
                value:
                  success: true
                  message: "Payment recorded successfully"
                  data:
                    id: 1
                    term_number: 1
                    amount_due: "12500.00"
                    amount_paid: "12500.00"
                    status: "paid"
                    payment_mode: "cash"
                    payment_date: "2024-04-05"
                    receipt_number: "RCP-001"
              partial:
                summary: Partially paid
                value:
                  success: true
                  message: "Payment recorded successfully"
                  data:
                    id: 1
                    term_number: 1
                    amount_due: "12500.00"
                    amount_paid: "6000.00"
                    status: "partial"
      '400':
        $ref: '#/components/responses/ValidationError'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '404':
        $ref: '#/components/responses/NotFound'

/fee-transactions/{id}/waiver:
  patch:
    tags:
      - Fee Transactions
    summary: Apply fee waiver
    description: |
      Apply a discount/scholarship waiver to a transaction (School Admin only).

      - `amount_due = original_amount - waiver_amount`
      - Status is recalculated after waiver
      - Waiver cannot exceed `original_amount`

      **Example:** original=12500, waiver=2000 → amount_due becomes 10500
    security:
      - BearerAuth: []
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApplyWaiver'
          example:
            waiverAmount: 2000.00
            waiverReason: "Merit scholarship"
    responses:
      '200':
        description: Fee waiver applied successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Success'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/FeeTransaction'
            example:
              success: true
              message: "Fee waiver applied successfully"
              data:
                id: 1
                original_amount: "12500.00"
                waiver_amount: "2000.00"
                amount_due: "10500.00"
                amount_paid: "0.00"
                status: "pending"
      '400':
        $ref: '#/components/responses/ValidationError'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
