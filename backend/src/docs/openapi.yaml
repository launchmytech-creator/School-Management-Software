openapi: 3.0.3
info:
  title: School Management System API
  description: |
    Multi-tenant School Management System REST API

    ## Roles
    - **Super Admin**: System-level access, can create schools
    - **School Admin**: School-level access, manages teachers, students, operations
    - **Accountant**: Financial management and limited academic operations
    - **Teacher**: Academic operations, attendance, and syllabus tracking
    - **Parent**: Read-only access to child's information
  version: 1.0.0
  contact:
    name: API Support
    email: support@schoolmanagement.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000/api/v1
    description: Development server
  - url: https://api.schoolmanagement.com/api/v1
    description: Production server

tags:
  - name: Authentication
    description: Authentication and authorization endpoints
  - name: Schools
    description: School management (Super Admin only)
  - name: Teachers
    description: Teacher management (Admin only)
  - name: Classes
    description: Class management (Admin, Accountant, Teacher)
  - name: Students
    description: Student management (Admin, Accountant, Teacher)
  - name: Subjects
    description: Subject management (Admin, Accountant, Teacher)
  - name: Chapters
    description: Chapter management (Admin, Accountant, Teacher)
  - name: Academic Years
    description: Academic year management (Admin, Accountant, Teacher)
  - name: Class Subjects
    description: Class-Subject assignments (Admin, Accountant, Teacher)
  - name: Teacher Allocations
    description: Teacher allocations - Business Plan (Admin, Accountant, Teacher)
  - name: Accountants
    description: Accountant management (Admin only)
  - name: Fee Structures
    description: Fee structures - Basic Plan (Admin, Accountant)
  - name: Fee Transactions
    description: Fee transactions and payments - Basic Plan (Admin, Accountant)
  - name: Student Attendance
    description: Student attendance - Premium Plan (Admin, Accountant, Teacher)
  - name: Teacher Attendance
    description: Teacher attendance - Premium Plan (Admin, Accountant)
  - name: Syllabus Completion
    description: Syllabus tracking - Premium Plan (Admin, Teacher)
  - name: Parents
    description: Parent management (Admin, Accountant)
  - name: Holidays
    description: Holiday management - Premium Plan (Admin, Accountant, Teacher)
  - name: Exams
    description: Exam management (Admin, Accountant, Teacher)
  - name: Exam Results
    description: Exam results and marks (Admin, Accountant, Teacher)
  - name: Student Promotions
    description: Student promotions (Admin, Accountant)
  - name: Parent Dashboard
    description: Parent portal - view children's marks, attendance, fees, syllabus (Parent only)
  - name: Notifications
    description: Email notifications - send, broadcast, and manage notification history

paths:
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from login endpoint

  responses:
    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            errorCode: "AUTH_002"
            message: "Authentication token is missing"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            errorCode: "AUTH_005"
            message: "You are not authorized to perform this action"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            errorCode: "SYS_003"
            message: "Requested resource not found"
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            errorCode: "VAL_001"
            message: "Validation failed"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            errorCode: "SYS_001"
            message: "Internal server error"

  parameters:
    IdPathParam:
      name: id
      in: path
      required: true
      description: Resource ID
      schema:
        type: integer
        minimum: 1
      example: 1

  schemas:
    Error:
      type: object
      required: [success, errorCode, message]
      properties:
        success:
          type: boolean
          example: false
        errorCode:
          type: string
          example: "AUTH_001"
        message:
          type: string
          example: "Invalid email or password"
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    Success:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation successful"
        data:
          type: object

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: "user@example.com"
        fullName:
          type: string
          example: "John Doe"
        role:
          type: string
          enum: [super_admin, school_admin, accountant, teacher, parent]
          example: "school_admin"
        schoolId:
          type: integer
          nullable: true
          example: 1
        schoolName:
          type: string
          nullable: true
          example: "ABC School"
        phone:
          type: string
          nullable: true
          example: "+1234567890"
        isActive:
          type: boolean
          example: true

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: "admin@school.com"
        password:
          type: string
          format: password
          example: "Admin@123"

    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/Success'
        - type: object
          properties:
            data:
              type: object
              properties:
                token:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                user:
                  $ref: '#/components/schemas/User'

    School:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "ABC International School"
        code:
          type: string
          example: "ABC001"
        subscriptionPlanId:
          type: integer
          enum: [1, 2, 3]
          example: 2
          description: "1=Basic, 2=Premium, 3=Business"
        subscriptionPlanName:
          type: string
          example: "Premium"
        subscriptionStatus:
          type: string
          enum: [active, suspended, expired, trial]
          example: "active"
        subscriptionEndDate:
          type: string
          format: date
          nullable: true
          example: "2025-12-31"
        feeTerms:
          type: integer
          enum: [1, 2, 4, 12]
          example: 4
        contactEmail:
          type: string
          format: email
          example: "contact@abcschool.com"
        contactPhone:
          type: string
          nullable: true
          example: "+1234567890"
        address:
          type: string
          nullable: true
          example: "123 Main Street"
        isActive:
          type: boolean
          example: true
        teacherCount:
          type: integer
          example: 25
        studentCount:
          type: integer
          example: 500
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"

    CreateSchoolRequest:
      type: object
      required: [school, admin]
      properties:
        school:
          type: object
          required: [name, code, contactEmail]
          properties:
            name:
              type: string
              minLength: 3
              maxLength: 200
              example: "ABC International School"
            code:
              type: string
              minLength: 2
              maxLength: 50
              example: "ABC001"
            subscriptionPlanId:
              type: integer
              enum: [1, 2, 3]
              default: 1
              example: 2
            contactEmail:
              type: string
              format: email
              example: "contact@abcschool.com"
            contactPhone:
              type: string
              example: "+1234567890"
            address:
              type: string
              example: "123 Main Street"
            subscriptionStatus:
              type: string
              enum: [active, trial]
              default: "trial"
            subscriptionEndDate:
              type: string
              format: date
              example: "2025-12-31"
        admin:
          type: object
          required: [email, password, fullName]
          properties:
            email:
              type: string
              format: email
              example: "admin@abcschool.com"
            password:
              type: string
              minLength: 8
              example: "Admin@123"
            fullName:
              type: string
              minLength: 3
              maxLength: 150
              example: "School Administrator"
            phone:
              type: string
              example: "+1234567890"

    UpdateSchoolRequest:
      type: object
      properties:
        name:
          type: string
          example: "ABC International School"
        subscriptionPlanId:
          type: integer
          enum: [1, 2, 3]
          example: 3
        subscriptionStatus:
          type: string
          enum: [active, suspended, expired, trial]
          example: "active"
        subscriptionEndDate:
          type: string
          format: date
          example: "2025-12-31"
        contactEmail:
          type: string
          format: email
          example: "contact@abcschool.com"
        contactPhone:
          type: string
          example: "+1234567890"
        address:
          type: string
          example: "123 Main Street"
        isActive:
          type: boolean
          example: true

    Teacher:
      type: object
      properties:
        id:
          type: integer
          example: 3
        email:
          type: string
          format: email
          example: "teacher@school.com"
        fullName:
          type: string
          example: "Jane Smith"
        role:
          type: string
          example: "teacher"
        phone:
          type: string
          nullable: true
          example: "+1234567890"
        dateOfBirth:
          type: string
          format: date
          nullable: true
          example: "1990-05-15"
        gender:
          type: string
          enum: [Male, Female, Other]
          nullable: true
          example: "Female"
        address:
          type: string
          nullable: true
          example: "456 Oak Avenue"
        schoolId:
          type: integer
          example: 1
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00.000Z"

    CreateTeacherRequest:
      type: object
      required: [email, password, fullName]
      properties:
        email:
          type: string
          format: email
          example: "teacher@school.com"
        password:
          type: string
          minLength: 8
          example: "Teacher@123"
        fullName:
          type: string
          minLength: 3
          maxLength: 150
          example: "Jane Smith"
        phone:
          type: string
          example: "+1234567890"
        dateOfBirth:
          type: string
          format: date
          example: "1990-05-15"
        gender:
          type: string
          enum: [Male, Female, Other]
          example: "Female"
        address:
          type: string
          example: "456 Oak Avenue"

    UpdateTeacherRequest:
      type: object
      properties:
        fullName:
          type: string
          example: "Jane Smith"
        phone:
          type: string
          example: "+1234567890"
        dateOfBirth:
          type: string
          format: date
          example: "1990-05-15"
        gender:
          type: string
          enum: [Male, Female, Other]
          example: "Female"
        address:
          type: string
          example: "456 Oak Avenue"
        isActive:
          type: boolean
          example: true

    Class:
      type: object
      properties:
        id:
          type: integer
          example: 1
        schoolId:
          type: integer
          example: 1
        name:
          type: string
          example: "Class 5"
        section:
          type: string
          nullable: true
          example: "A"
        academicYearId:
          type: integer
          example: 1
        yearName:
          type: string
          example: "2024-2025"
        defaultFeeAmount:
          type: number
          format: decimal
          nullable: true
          example: 25000.00
        studentCount:
          type: integer
          example: 45

    CreateClassRequest:
      type: object
      required: [name, academicYearId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: "Class 5"
        section:
          type: string
          maxLength: 10
          example: "A"
        academicYearId:
          type: integer
          example: 1
        defaultFeeAmount:
          type: number
          format: decimal
          example: 25000.00

    UpdateClassRequest:
      type: object
      properties:
        name:
          type: string
          example: "Class 5"
        section:
          type: string
          example: "B"
        defaultFeeAmount:
          type: number
          format: decimal
          example: 30000.00

    Student:
      type: object
      properties:
        id:
          type: integer
          example: 1
        schoolId:
          type: integer
          example: 1
        admissionNumber:
          type: string
          example: "2024001"
        fullName:
          type: string
          example: "John Doe"
        dateOfBirth:
          type: string
          format: date
          nullable: true
          example: "2010-05-15"
        gender:
          type: string
          enum: [male, female, other]
          nullable: true
          example: "male"
        address:
          type: string
          nullable: true
          example: "123 Main Street"
        phone:
          type: string
          nullable: true
          example: "1234567890"
        admissionDate:
          type: string
          format: date
          example: "2024-04-01"
        currentClassId:
          type: integer
          nullable: true
          example: 1
        className:
          type: string
          nullable: true
          example: "Class 5"
        classSection:
          type: string
          nullable: true
          example: "A"
        parentId:
          type: integer
          nullable: true
          example: 5
        rollNumber:
          type: string
          nullable: true
          example: "01"
        status:
          type: string
          enum: [active, inactive, transferred, graduated]
          example: "active"
        createdAt:
          type: string
          format: date-time
          example: "2024-04-01T10:30:00.000Z"

    CreateStudentRequest:
      type: object
      required: [admissionNumber, fullName, admissionDate]
      properties:
        admissionNumber:
          type: string
          minLength: 1
          maxLength: 50
          example: "2024001"
        fullName:
          type: string
          minLength: 3
          maxLength: 150
          example: "John Doe"
        dateOfBirth:
          type: string
          format: date
          example: "2010-05-15"
        gender:
          type: string
          enum: [male, female, other]
          example: "male"
        address:
          type: string
          example: "123 Main Street"
        phone:
          type: string
          example: "1234567890"
        admissionDate:
          type: string
          format: date
          example: "2024-04-01"
        currentClassId:
          type: integer
          example: 1
        parentId:
          type: integer
          example: 5
        rollNumber:
          type: string
          maxLength: 20
          example: "01"
        status:
          type: string
          enum: [active, inactive, transferred, graduated]
          default: "active"

    UpdateStudentRequest:
      type: object
      properties:
        fullName:
          type: string
          example: "John Doe"
        dateOfBirth:
          type: string
          format: date
          example: "2010-05-15"
        gender:
          type: string
          enum: [male, female, other]
          example: "male"
        address:
          type: string
          example: "123 Main Street"
        phone:
          type: string
          example: "1234567890"
        currentClassId:
          type: integer
          example: 2
        parentId:
          type: integer
          example: 5
        rollNumber:
          type: string
          example: "15"
        status:
          type: string
          enum: [active, inactive, transferred, graduated]
          example: "active"

    Subject:
      type: object
      properties:
        id:
          type: integer
          example: 1
        schoolId:
          type: integer
          example: 1
        name:
          type: string
          example: "Mathematics"
        code:
          type: string
          example: "MATH"
        chapterCount:
          type: integer
          example: 12

    CreateSubjectRequest:
      type: object
      required: [name, code]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: "Mathematics"
        code:
          type: string
          minLength: 2
          maxLength: 20
          example: "MATH"

    UpdateSubjectRequest:
      type: object
      properties:
        name:
          type: string
          example: "Advanced Mathematics"
        code:
          type: string
          example: "AMATH"

    Chapter:
      type: object
      properties:
        id:
          type: integer
          example: 1
        schoolId:
          type: integer
          example: 1
        subjectId:
          type: integer
          example: 1
        subjectName:
          type: string
          example: "Science"
        name:
          type: string
          example: "Photosynthesis"
        sequenceNumber:
          type: integer
          nullable: true
          example: 1
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00.000Z"

    CreateChapterRequest:
      type: object
      required: [subjectId, name]
      properties:
        subjectId:
          type: integer
          example: 1
        name:
          type: string
          minLength: 2
          maxLength: 200
          example: "Photosynthesis"
        sequenceNumber:
          type: integer
          example: 1

    UpdateChapterRequest:
      type: object
      properties:
        name:
          type: string
          example: "Advanced Photosynthesis"
        sequenceNumber:
          type: integer
          example: 5

    AcademicYear:
      type: object
      properties:
        id:
          type: integer
          example: 1
        schoolId:
          type: integer
          example: 1
        yearName:
          type: string
          example: "2024-2025"
        startDate:
          type: string
          format: date
          example: "2024-04-01"
        endDate:
          type: string
          format: date
          example: "2025-03-31"
        isCurrent:
          type: boolean
          example: true
        classCount:
          type: integer
          example: 12

    CreateAcademicYearRequest:
      type: object
      required: [yearName, startDate, endDate]
      properties:
        yearName:
          type: string
          example: "2024-2025"
        startDate:
          type: string
          format: date
          example: "2024-04-01"
        endDate:
          type: string
          format: date
          example: "2025-03-31"
        isCurrent:
          type: boolean
          default: false
          example: true

    UpdateAcademicYearRequest:
      type: object
      properties:
        yearName:
          type: string
          example: "2024-2025"
        startDate:
          type: string
          format: date
          example: "2024-04-01"
        endDate:
          type: string
          format: date
          example: "2025-03-31"
        isCurrent:
          type: boolean
          example: true

    ClassSubject:
      type: object
      properties:
        id:
          type: integer
          example: 1
        classId:
          type: integer
          example: 1
        className:
          type: string
          example: "Class 5"
        subjectId:
          type: integer
          example: 2
        subjectName:
          type: string
          example: "Mathematics"
        academicYearId:
          type: integer
          example: 1
        yearName:
          type: string
          example: "2024-2025"
        maxMarks:
          type: number
          format: decimal
          nullable: true
          example: 100.00

    AssignSubjectRequest:
      type: object
      required: [classId, subjectId, academicYearId]
      properties:
        classId:
          type: integer
          example: 1
        subjectId:
          type: integer
          example: 2
        academicYearId:
          type: integer
          example: 1
        maxMarks:
          type: number
          format: decimal
          example: 100.00

    UpdateClassSubjectRequest:
      type: object
      properties:
        maxMarks:
          type: number
          format: decimal
          example: 150.00

    TeacherAllocation:
      type: object
      properties:
        id:
          type: integer
          example: 1
        teacherId:
          type: integer
          example: 5
        teacherName:
          type: string
          example: "Jane Smith"
        classId:
          type: integer
          example: 1
        className:
          type: string
          example: "Class 5"
        subjectId:
          type: integer
          example: 2
        subjectName:
          type: string
          example: "Mathematics"
        academicYearId:
          type: integer
          example: 1
        yearName:
          type: string
          example: "2024-2025"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00.000Z"

    AllocateTeacherRequest:
      type: object
      required: [teacherId, classId, subjectId, academicYearId]
      properties:
        teacherId:
          type: integer
          example: 5
        classId:
          type: integer
          example: 1
        subjectId:
          type: integer
          example: 2
        academicYearId:
          type: integer
          example: 1

    Accountant:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: "accountant@school.com"
        fullName:
          type: string
          example: "John Accountant"
        role:
          type: string
          example: "accountant"
        phone:
          type: string
          nullable: true
          example: "1234567890"
        dateOfBirth:
          type: string
          format: date
          nullable: true
          example: "1985-06-15"
        gender:
          type: string
          enum: [Male, Female, Other]
          nullable: true
          example: "Male"
        address:
          type: string
          nullable: true
          example: "456 Oak Avenue"
        schoolId:
          type: integer
          example: 1
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2024-03-11T10:30:00.000Z"

    CreateAccountantRequest:
      type: object
      required: [email, password, fullName]
      properties:
        email:
          type: string
          format: email
          example: "accountant@school.com"
        password:
          type: string
          minLength: 8
          example: "Accountant@123"
        fullName:
          type: string
          minLength: 3
          maxLength: 150
          example: "John Accountant"
        phone:
          type: string
          example: "1234567890"
        dateOfBirth:
          type: string
          format: date
          example: "1985-06-15"
        gender:
          type: string
          enum: [Male, Female, Other]
          example: "Male"
        address:
          type: string
          example: "456 Oak Avenue"

    UpdateAccountantRequest:
      type: object
      properties:
        fullName:
          type: string
          example: "John Accountant"
        phone:
          type: string
          example: "1234567890"
        dateOfBirth:
          type: string
          format: date
          example: "1985-06-15"
        gender:
          type: string
          enum: [Male, Female, Other]
          example: "Male"
        address:
          type: string
          example: "456 Oak Avenue"
        isActive:
          type: boolean
          example: true

    FeeStructure:
      type: object
      description: A single fee component row (one fee type, annual amount)
      properties:
        id:
          type: integer
          example: 1
        schoolId:
          type: integer
          example: 1
        classId:
          type: integer
          example: 1
        className:
          type: string
          example: "Class 5"
        classSection:
          type: string
          nullable: true
          example: "A"
        academicYearId:
          type: integer
          example: 1
        academicYearName:
          type: string
          example: "2024-2025"
        feeType:
          type: string
          example: "Tuition Fee"
        amount:
          type: number
          format: decimal
          example: 30000.00
          description: Annual amount for this fee type
        feeTerms:
          type: integer
          enum: [1, 2, 4, 12]
          description: Payment frequency for the class+year group
          example: 4

    FeeStructureGroup:
      type: object
      description: Grouped view of all fee components for a class+year with totals
      properties:
        classId:
          type: integer
          example: 1
        academicYearId:
          type: integer
          example: 1
        className:
          type: string
          example: "Class 5"
        classSection:
          type: string
          nullable: true
          example: "A"
        academicYearName:
          type: string
          example: "2024-2025"
        feeTerms:
          type: integer
          enum: [1, 2, 4, 12]
          description: "1=Yearly, 2=Half-yearly, 4=Quarterly, 12=Monthly"
          example: 4
        totalAnnualFee:
          type: number
          format: decimal
          description: Sum of all fee component annual amounts
          example: 50000.00
        perTermAmount:
          type: number
          format: decimal
          description: totalAnnualFee / feeTerms — what each student pays per term
          example: 12500.00
        components:
          type: array
          description: Individual fee type breakdown
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              fee_type:
                type: string
                example: "Tuition Fee"
              annual_amount:
                type: number
                format: decimal
                example: 30000.00

    CreateFeeStructure:
      type: object
      required: [classId, academicYearId, feeTerms, feeType, amount]
      description: |
        Add one fee component to a class+year group.
        - `amount` is the **annual amount** for this fee type
        - `feeTerms` must be the same for all components in the same class+year group
        - System auto-calculates per-term = annual / feeTerms at transaction generation
      properties:
        classId:
          type: integer
          example: 1
        academicYearId:
          type: integer
          example: 1
        feeTerms:
          type: integer
          enum: [1, 2, 4, 12]
          example: 4
          description: "1=Yearly, 2=Half-yearly, 4=Quarterly, 12=Monthly"
        feeType:
          type: string
          maxLength: 50
          example: "Tuition Fee"
        amount:
          type: number
          format: decimal
          example: 30000.00
          description: Annual amount for this fee type

