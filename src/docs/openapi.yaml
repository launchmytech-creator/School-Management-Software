          description: Teacher retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Teacher"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # Classes endpoints
  /classes:
    post:
      tags:
        - Classes
      summary: Create class
      description: Create a new class for the school (School Admin only)
      operationId: createClass
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassRequest"
            examples:
              basicClass:
                summary: Create basic class
                value:
                  name: "Class 5"
                  section: "A"
                  academicYearId: 1
                  defaultFeeAmount: 25000.00
              classWithoutSection:
