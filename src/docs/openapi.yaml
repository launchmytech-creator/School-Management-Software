          example: "2024-2025"
        startDate:
          type: string
          format: date
          example: "2024-04-01"
        endDate:
          type: string
          format: date
          example: "2025-03-31"
        isCurrent:
          type: boolean
          example: true

    UpdateAcademicYearRequest:
      type: object
      properties:
        yearName:
          type: string
          example: "2024-2025"
        startDate:
          type: string
          format: date
          example: "2024-04-01"
        endDate:
          type: string
          format: date
          example: "2025-03-31"

    # Class Subject related schemas
    ClassSubject:
      type: object
      properties:
