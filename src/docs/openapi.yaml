          example: 1
        classId:
          type: integer
          example: 1
        className:
          type: string
          example: "Class 5"
        subjectId:
          type: integer
          example: 2
        subjectName:
          type: string
          example: "Mathematics"
        academicYearId:
          type: integer
          example: 1
        academicYearName:
          type: string
          example: "2024-2025"
        maxMarks:
          type: number
          format: decimal
          example: 100.00
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00.000Z"

    AssignSubjectRequest:
      type: object
      required:
        - classId
        - subjectId
        - academicYearId
      properties:
        classId:
          type: integer
          example: 1
        subjectId:
          type: integer
          example: 2
        academicYearId:
          type: integer
          example: 1
        maxMarks:
          type: number
          format: decimal
          example: 100.00

    UpdateClassSubjectRequest:
      type: object
      properties:
        maxMarks:
          type: number
          format: decimal
          example: 150.00

    # Teacher Allocation related schemas
    TeacherAllocation:
      type: object
      properties:
        id:
          type: integer
          example: 1
        teacherId:
          type: integer
          example: 5
        teacherName:
          type: string
          example: "Mr. John Smith"
        classId:
          type: integer
          example: 1
        className:
          type: string
          example: "Class 5"
        subjectId:
          type: integer
          example: 2
        subjectName:
          type: string
          example: "Mathematics"
        academicYearId:
          type: integer
          example: 1
        academicYearName:
          type: string
          example: "2024-2025"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00.000Z"

    AllocateTeacherRequest:
      type: object
      required:
        - teacherId
        - classId
        - subjectId
        - academicYearId
      properties:
        teacherId:
          type: integer
          example: 5
        classId:
          type: integer
          example: 1
        subjectId:
          type: integer
          example: 2
        academicYearId:
          type: integer
          example: 1

    # Accountant related schemas
    Accountant:
      type: object
      properties:
        id:
          type: integer
          example: 1
        schoolId:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: "accountant@school.com"
        fullName:
          type: string
          example: "John Accountant"
        phone:
          type: string
          example: "1234567890"
        dateOfBirth:
          type: string
          format: date
          example: "1985-06-15"
        gender:
          type: string
          enum: [Male, Female, Other]
          example: "Male"
        address:
          type: string
          example: "456 Oak Avenue"
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00.000Z"

    CreateAccountantRequest:
      type: object
      required:
