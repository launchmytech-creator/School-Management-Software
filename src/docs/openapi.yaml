openapi: 3.0.3
info:
  title: School Management System API
  description: |
    Multi-tenant School Management System REST API

    ## Features
    - JWT Authentication
    - Role-based Access Control
    - Multi-tenant Architecture
    - Comprehensive School Management

    ## Roles
    - **Super Admin**: System-level access, can create schools
    - **School Admin**: School-level access, can manage teachers, students, and school operations
    - **Accountant**: Financial management and limited academic operations
    - **Teacher**: Academic operations, attendance, and syllabus tracking
    - **Parent**: Read-only access to child's information
  version: 1.0.0
  contact:
    name: API Support
    email: support@schoolmanagement.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000/api/v1
    description: Development server
  - url: https://api.schoolmanagement.com/api/v1
    description: Production server

tags:
  - name: Authentication
    description: Authentication and authorization endpoints
  - name: Schools
    description: School management operations (Super Admin only)
  - name: Teachers
    description: Teacher management operations (Admin only)
  - name: Classes
    description: Class management operations (Admin, Accountant, Teacher)
  - name: Students
    description: Student management operations (Admin, Accountant, Teacher)
  - name: Subjects
    description: Subject management operations (Admin, Accountant, Teacher)
  - name: Chapters
    description: Chapter management operations (Admin, Accountant, Teacher)
  - name: Academic Years
    description: Academic year management operations (Admin, Accountant, Teacher)
  - name: Class Subjects
    description: Class-Subject assignment operations (Admin, Accountant, Teacher)
  - name: Teacher Allocations
    description: Teacher allocation operations - Business Plan feature (Admin, Accountant, Teacher)
  - name: Accountants
    description: Accountant management operations (Admin only)
  - name: Fee Structures
    description: Fee structure management operations - Basic Plan feature (Admin, Accountant)
  - name: Fee Transactions
    description: Fee transaction and payment management - Basic Plan feature (Admin, Accountant)
  - name: Student Attendance
    description: Student attendance management - Premium Plan feature (Admin, Accountant, Teacher)
  - name: Teacher Attendance
    description: Teacher attendance management - Premium Plan feature (Admin, Accountant)
  - name: Syllabus Completion
    description: Syllabus completion tracking - Premium Plan feature (Admin, Teacher)
  - name: Parents
    description: Parent management operations (Admin, Accountant)
  - name: Holidays
    description: Holiday management and working days calculation - Premium Plan feature (Admin, Accountant, Teacher)


components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from login endpoint

  responses:
    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            success: false
            errorCode: "AUTH_001"
            message: "Unauthorized"

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            success: false
            errorCode: "AUTH_003"
            message: "Forbidden"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            success: false
            errorCode: "NOT_FOUND"
            message: "Resource not found"

    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            success: false
            errorCode: "VALIDATION_ERROR"
            message: "Validation failed"
            errors:
              - field: "email"
                message: "Invalid email format"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            success: false
            errorCode: "INTERNAL_ERROR"
            message: "An unexpected error occurred"

  schemas:
    Error:
      type: object
      required:
        - success
        - errorCode
        - message
      properties:
        success:
          type: boolean
          example: false
        errorCode:
          type: string
          example: "AUTH_001"
        message:
          type: string
          example: "Invalid email or password"
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    Success:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation successful"
        data:
          type: object

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: "user@example.com"
        fullName:
          type: string
          example: "John Doe"
        role:
          type: string
          enum: [super_admin, school_admin, accountant, teacher, parent]
          example: "school_admin"
        schoolId:
          type: integer
          nullable: true
          example: 1
        schoolName:
          type: string
          nullable: true
          example: "ABC School"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "admin@school.com"
        password:
          type: string
          format: password
          example: "Admin@123"

    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/Success"
        - type: object
          properties:
            data:
              type: object
              properties:
                token:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                user:
                  $ref: "#/components/schemas/User"

    School:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "ABC International School"
        code:
          type: string
          example: "ABC001"
        subscriptionPlanId:
          type: integer
          enum: [1, 2, 3]
          example: 2
          description: "1=Basic, 2=Premium, 3=Business"
        subscriptionPlanName:
          type: string
          example: "Premium"
        subscriptionFeatures:
          type: object
          example:
            {
              "fee_management": true,
              "marks_management": true,
              "attendance": true,
              "syllabus_tracking": true,
              "teacher_allocation": false,
              "analytics": false,
            }
        subscriptionStatus:
          type: string
          enum: [active, suspended, expired, trial]
          example: "active"
        subscriptionEndDate:
          type: string
          format: date
          nullable: true
          example: "2025-12-31"
        feeTerms:
          type: integer
          enum: [1, 2, 4, 12]
          example: 4
          description: "1=Yearly, 2=Half-yearly, 4=Quarterly, 12=Monthly"
        contactEmail:
          type: string
          format: email
          example: "contact@abcschool.com"
        contactPhone:
          type: string
          nullable: true
          example: "+1234567890"
        address:
          type: string
          nullable: true
          example: "123 Main Street"
        isActive:
          type: boolean
          example: true
        teacherCount:
          type: integer
          example: 25
        studentCount:
          type: integer
          example: 500
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"

    CreateSchoolRequest:
      type: object
      required:
        - school
        - admin
      properties:
        school:
          type: object
          required:
            - name
            - code
            - contactEmail
          properties:
            name:
              type: string
              minLength: 3
              maxLength: 200
              example: "ABC International School"
            code:
              type: string
              minLength: 2
              maxLength: 50
              example: "ABC001"
            subscriptionPlanId:
              type: integer
              enum: [1, 2, 3]
              default: 1
              example: 2
              description: "1=Basic, 2=Premium, 3=Business"
            feeTerms:
              type: integer
              enum: [1, 2, 4, 12]
              default: 1
              example: 4
              description: "1=Yearly, 2=Half-yearly, 4=Quarterly, 12=Monthly"
            contactEmail:
              type: string
              format: email
              example: "contact@abcschool.com"
            contactPhone:
              type: string
              example: "+1234567890"
            address:
              type: string
              example: "123 Main Street"
            subscriptionStatus:
              type: string
              enum: [active, trial]
              default: "trial"
            subscriptionEndDate:
              type: string
              format: date
              example: "2025-12-31"
        admin:
          type: object
          required:
            - email
            - password
            - fullName
          properties:
            email:
              type: string
              format: email
              example: "admin@abcschool.com"
            password:
              type: string
              minLength: 8
              example: "Admin@123"
            fullName:
              type: string
              minLength: 3
              maxLength: 150
              example: "School Administrator"
            phone:
              type: string
              example: "+1234567890"

    UpdateSchoolRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 200
          example: "ABC International School"
        subscriptionPlanId:
          type: integer
          enum: [1, 2, 3]
          example: 3
          description: "1=Basic, 2=Premium, 3=Business. Changes are tracked in history."
        feeTerms:
          type: integer
          enum: [1, 2, 4, 12]
          example: 12
          description: "1=Yearly, 2=Half-yearly, 4=Quarterly, 12=Monthly. Changes are tracked in history."
        subscriptionStatus:
          type: string
          enum: [active, suspended, expired, trial]
          example: "active"
        subscriptionEndDate:
          type: string
          format: date
          example: "2025-12-31"
        contactEmail:
          type: string
          format: email
          example: "contact@abcschool.com"
        contactPhone:
          type: string
          example: "+1234567890"
        address:
          type: string
          example: "123 Main Street"
        isActive:
          type: boolean
          example: true

    Teacher:
      type: object
      properties:
        id:
          type: integer
          example: 3
        email:
          type: string
          format: email
          example: "teacher@school.com"
        fullName:
          type: string
          example: "Jane Smith"
        role:
          type: string
          example: "teacher"
        phone:
          type: string
          example: "+1234567890"
        isActive:
          type: boolean
          example: true

    CreateTeacherRequest:
      type: object
      required:
        - email
        - password
        - fullName
      properties:
        email:
          type: string
          format: email
          example: "teacher@school.com"
        password:
          type: string
          minLength: 8
          example: "Teacher@123"
        fullName:
          type: string
          example: "Jane Smith"
        phone:
          type: string
          example: "+1234567890"
        dateOfBirth:
          type: string
          format: date
          example: "1990-05-15"
        gender:
          type: string
          enum: [Male, Female, Other]
          example: "Female"
        address:
          type: string
          example: "456 Oak Avenue"


     # Holiday related schemas
    Holiday:
      type: object
      properties:
        id:
          type: integer
          example: 1
        holidayDate:
          type: string
          format: date
          example: "2024-08-15"
        description:
          type: string
          nullable: true
          example: "Independence Day"

    CreateHoliday:
      type: object
      required:
        - holidayDate
        - academicYearId
      properties:
        holidayDate:
          type: string
          format: date
          example: "2024-08-15"
        description:
          type: string
          maxLength: 200
          example: "Independence Day"
        academicYearId:
          type: integer
          example: 1

    UpdateHoliday:
      type: object
      properties:
        holidayDate:
          type: string
          format: date
          example: "2024-08-15"
        description:
          type: string
          maxLength: 200
          example: "Independence Day - National Holiday"



    # Syllabus Completion related schemas
    SyllabusCompletion:
      type: object
      properties:
        id:
          type: integer
          example: 1
        chapterId:
          type: integer
          example: 5
        chapterName:
          type: string
          example: "Photosynthesis"
        status:
          type: string
          enum: [pending, in_progress, completed]
          example: "completed"

    MarkSyllabusCompletion:
      type: object
      required:
        - classSubjectId
        - chapters
      properties:
        classSubjectId:
          type: integer
          example: 1
        chapters:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - chapterId
              - status
            properties:
              chapterId:
                type: integer
                example: 5
              status:
                type: string
                enum: [pending, in_progress, completed]
                example: "completed"


    # Class related schemas
    Class:
      type: object
      properties:
        id:
          type: integer
          example: 1
        schoolId:
          type: integer
          example: 1
        name:
          type: string
          example: "Class 5"
        section:
          type: string
          nullable: true
          example: "A"
        academicYearId:
          type: integer
          example: 1
        yearName:
          type: string
          example: "2024-2025"
        startDate:
          type: string
          format: date
          example: "2024-04-01"
        endDate:
          type: string
          format: date
          example: "2025-03-31"
        defaultFeeAmount:
          type: number
          format: decimal
          nullable: true
          example: 25000.00
        studentCount:
          type: integer
          example: 45

    CreateClassRequest:
      type: object
      required:
        - name
        - academicYearId
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: "Class 5"
        section:
          type: string
          maxLength: 10
          example: "A"
        academicYearId:
          type: integer
          example: 1
        defaultFeeAmount:
          type: number
          format: decimal
          example: 25000.00

    UpdateClassRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: "Class 5"
        section:
          type: string
          maxLength: 10
          example: "B"
        defaultFeeAmount:
          type: number
          format: decimal
          example: 30000.00



          # Student Attendance related schemas
    StudentAttendance:
      type: object
      properties:
        id:
          type: integer
          example: 1
        studentId:
          type: integer
          example: 10
        studentName:
          type: string
          example: "John Doe"
        attendanceDate:
          type: string
          format: date
          example: "2024-03-11"
        status:
          type: string
          enum: [present, absent, late]
          example: "present"

    MarkStudentAttendance:
      type: object
      required:
        - classId
        - attendanceDate
        - records
      properties:
        classId:
          type: integer
          example: 1
        attendanceDate:
          type: string
          format: date
          example: "2024-03-11"
        records:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - studentId
              - status
            properties:
              studentId:
                type: integer
                example: 10
              status:
                type: string
                enum: [present, absent, late]
                example: "present"




           # Teacher Attendance related schemas
    TeacherAttendance:
      type: object
      properties:
        id:
          type: integer
          example: 1
        teacherId:
          type: integer
          example: 5
        teacherName:
          type: string
          example: "Jane Smith"
        attendanceDate:
          type: string
          format: date
          example: "2024-03-11"
        status:
          type: string
          enum: [present, absent, late]
          example: "present"

    MarkTeacherAttendance:
      type: object
      required:
        - attendanceDate
        - records
      properties:
        attendanceDate:
          type: string
          format: date
          example: "2024-03-11"
        records:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - teacherId
              - status
            properties:
              teacherId:
                type: integer
                example: 5
              status:
                type: string
                enum: [present, absent, late]
                example: "present"

    # Student related schemas
    Student:
      type: object
      properties:
        id:
          type: integer
          example: 1
        schoolId:
          type: integer
          example: 1
        admissionNumber:
          type: string
          example: "2024001"
        fullName:
          type: string
          example: "John Doe"
        dateOfBirth:
          type: string
          format: date
          nullable: true
          example: "2010-05-15"
        gender:
          type: string
          enum: [male, female, other]
          nullable: true
          example: "male"
        address:
          type: string
          nullable: true
          example: "123 Main Street"
        phone:
          type: string
          nullable: true
          example: "1234567890"
        admissionDate:
          type: string
          format: date
          example: "2024-04-01"
        currentClassId:
          type: integer
          nullable: true
          example: 1
        className:
          type: string
          nullable: true
          example: "Class 5"
        classSection:
          type: string
          nullable: true
          example: "A"
        parentId:
          type: integer
          nullable: true
          example: 5
        rollNumber:
          type: string
          nullable: true
          example: "01"
        status:
          type: string
          enum: [active, inactive, transferred, graduated]
          example: "active"
        createdAt:
          type: string
          format: date-time
          example: "2024-04-01T10:30:00.000Z"

    CreateStudentRequest:
      type: object
      required:
        - admissionNumber
        - fullName
        - admissionDate
      properties:
        admissionNumber:
          type: string
          minLength: 1
          maxLength: 50
          example: "2024001"
        fullName:
          type: string
          minLength: 3
          maxLength: 150
          example: "John Doe"
        dateOfBirth:
          type: string
          format: date
          example: "2010-05-15"
        gender:
          type: string
          enum: [male, female, other]
          example: "male"
        address:
          type: string
          example: "123 Main Street"
        phone:
          type: string
          example: "1234567890"
        admissionDate:
          type: string
          format: date
          example: "2024-04-01"
        currentClassId:
          type: integer
          example: 1
        parentId:
          type: integer
          example: 5
        rollNumber:
          type: string
          maxLength: 20
          example: "01"
        status:
          type: string
          enum: [active, inactive, transferred, graduated]
          default: "active"
          example: "active"

    UpdateStudentRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 3
          maxLength: 150
          example: "John Doe"
        dateOfBirth:
          type: string
          format: date
          example: "2010-05-15"
        gender:
          type: string
          enum: [male, female, other]
          example: "male"
        address:
          type: string
          example: "123 Main Street"
        phone:
          type: string
          example: "1234567890"
        currentClassId:
          type: integer
          example: 2
        parentId:
          type: integer
          example: 5
        rollNumber:
          type: string
          maxLength: 20
          example: "15"
        status:
          type: string
          enum: [active, inactive, transferred, graduated]
          example: "active"

    # Subject related schemas
    Subject:
      type: object
      properties:
        id:
          type: integer
          example: 1
        schoolId:
          type: integer
          example: 1
        name:
          type: string
          example: "Mathematics"
        code:
          type: string
          example: "MATH"
        chapterCount:
          type: integer
          example: 12

    CreateSubjectRequest:
      type: object
      required:
        - name
        - code
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: "Mathematics"
        code:
          type: string
          minLength: 2
          maxLength: 20
          example: "MATH"

    UpdateSubjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: "Advanced Mathematics"
        code:
          type: string
          minLength: 2
          maxLength: 20
          example: "AMATH"

    # Chapter related schemas
    Chapter:
      type: object
      properties:
        id:
          type: integer
          example: 1
        schoolId:
          type: integer
          example: 1
        subjectId:
          type: integer
          example: 1
        subjectName:
          type: string
          example: "Science"
        name:
          type: string
          example: "Photosynthesis"
        sequenceNumber:
          type: integer
          nullable: true
          example: 1
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00.000Z"

    CreateChapterRequest:
      type: object
      required:
        - subjectId
        - name
      properties:
        subjectId:
          type: integer
          example: 1
        name:
          type: string
          minLength: 2
          maxLength: 200
          example: "Photosynthesis"
        sequenceNumber:
          type: integer
          example: 1

    UpdateChapterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
          example: "Advanced Photosynthesis"
        sequenceNumber:
          type: integer
          example: 5

    # Fee Structure related schemas
    FeeStructure:
      type: object
      properties:
        id:
          type: integer
          example: 1
        schoolId:
          type: integer
          example: 1
        classId:
          type: integer
          example: 1
        className:
          type: string
          example: "Class 5"
        classSection:
          type: string
          nullable: true
          example: "A"
        academicYearId:
          type: integer
          example: 1
        academicYearName:
          type: string
          example: "2024-2025"
        feeType:
          type: string
          example: "Tuition Fee"
        amount:
          type: number
          format: decimal
          example: 25000.00
        termNumber:
          type: integer
          nullable: true
          example: 1

    CreateFeeStructure:
      type: object
      required:
        - classId
        - academicYearId
        - feeType
        - amount
      properties:
        classId:
          type: integer
          example: 1
        academicYearId:
          type: integer
          example: 1
        feeType:
          type: string
          maxLength: 50
          example: "Tuition Fee"
        amount:
          type: number
          format: decimal
          example: 25000.00
        termNumber:
          type: integer
          minimum: 1
          maximum: 12
          example: 1

    UpdateFeeStructure:
      type: object
      properties:
        amount:
          type: number
          format: decimal
          example: 30000.00
        feeType:
          type: string
          maxLength: 50
          example: "Annual Fee"

    # Fee Transaction related schemas
    FeeTransaction:
      type: object
      properties:
        id:
          type: integer
          example: 1
        schoolId:
          type: integer
          example: 1
        studentId:
          type: integer
          example: 10
        studentName:
          type: string
          example: "John Doe"
        admissionNumber:
          type: string
          example: "2024001"
        feeStructureId:
          type: integer
          example: 1
        feeType:
          type: string
          example: "Tuition Fee"
        originalAmount:
          type: number
          format: decimal
          example: 25000.00
        amountDue:
          type: number
          format: decimal
          example: 25000.00
        amountPaid:
          type: number
          format: decimal
          example: 0.00
        waiverAmount:
          type: number
          format: decimal
          example: 0.00
        status:
          type: string
          enum: [pending, partial, paid]
          example: "pending"
        paymentMode:
          type: string
          enum: [cash, card, upi, cheque, bank_transfer]
          nullable: true
          example: "upi"

    GenerateFeeTransactions:
      type: object
      required:
        - feeStructureId
        - academicYearStartDate
      properties:
        feeStructureId:
          type: integer
          example: 1
        academicYearStartDate:
          type: string
          format: date
          example: "2024-04-01"

    RecordPayment:
      type: object
      required:
        - amountPaid
        - paymentMode
      properties:
        amountPaid:
          type: number
          format: decimal
          example: 5000.00
        paymentDate:
          type: string
