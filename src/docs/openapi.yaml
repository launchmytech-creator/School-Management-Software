          example: 15
        school_id:
          type: integer
          example: 1
        role:
          type: string
          example: "parent"
        email:
          type: string
          format: email
          example: "parent@example.com"
        full_name:
          type: string
          example: "John Parent"
        phone:
          type: string
          example: "9876543210"
        date_of_birth:
          type: string
          format: date
          example: "1980-05-15"
        gender:
          type: string
          enum: [Male, Female, Other]
          example: "Male"
        address:
          type: string
          example: "123 Main Street, City"
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: "2024-03-12T10:30:00.000Z"

    ParentWithChildren:
      allOf:
        - $ref: "#/components/schemas/Parent"
        - type: object
          properties:
            children_count:
              type: integer
              example: 2

    CreateParentRequest:
      type: object
      required:
        - email
        - password
        - fullName
      properties:
        email:
          type: string
          format: email
          example: "parent@example.com"
        password:
          type: string
          format: password
          example: "Parent@123"
        fullName:
          type: string
          example: "John Parent"
        phone:
          type: string
          example: "9876543210"
        dateOfBirth:
          type: string
          format: date
          example: "1980-05-15"
        gender:
          type: string
          enum: [Male, Female, Other]
          example: "Male"
        address:
          type: string
          example: "123 Main Street, City"

    UpdateParentRequest:
      type: object
      properties:
        fullName:
          type: string
          example: "John Updated Parent"
        phone:
          type: string
          example: "9999888877"
        dateOfBirth:
          type: string
          format: date
          example: "1980-05-15"
        gender:
          type: string
          enum: [Male, Female, Other]
          example: "Male"
        address:
          type: string
          example: "789 New Street, Updated City"

    LinkStudentRequest:
      type: object
      required:
        - studentId
      properties:
        studentId:
          type: integer
          example: 25

    StudentBasic:
      type: object
      properties:
        id:
          type: integer
          example: 25
        admission_number:
          type: string
          example: "STU2024025"
        full_name:
          type: string
          example: "Rahul Kumar"
        date_of_birth:
          type: string
          format: date
          example: "2010-06-15"
        gender:
          type: string
          example: "male"
        roll_number:
          type: string
          example: "15"
        status:
          type: string
          example: "active"
        class_name:
          type: string
          example: "Class 5"
        class_section:
          type: string
          example: "A"

    # Exam related schemas
    Exam:
      type: object
      properties:
        id:
          type: integer
          example: 1
        classId:
          type: integer
          example: 1
        className:
          type: string
          example: "Class 5"
        name:
          type: string
          example: "Half Yearly Examination"
        startDate:
          type: string
          format: date
          example: "2024-09-01"
        endDate:
          type: string
          format: date
          example: "2024-09-15"

    CreateExam:
      type: object
      required:
        - classId
        - academicYearId
        - name
        - startDate
        - endDate
      properties:
        classId:
          type: integer
          example: 1
        academicYearId:
          type: integer
          example: 1
        name:
          type: string
          maxLength: 100
          example: "Half Yearly Examination"
        examType:
          type: string
          maxLength: 50
          example: "Half Yearly"
        startDate:
          type: string
          format: date
          example: "2024-09-01"
        endDate:
          type: string
          format: date
          example: "2024-09-15"
        weightage:
          type: number
          format: decimal
          minimum: 0
          maximum: 100
          example: 50.00
        subjects:
          type: array
          items:
            type: object
            required:
              - subjectId
              - maxMarks
            properties:
              subjectId:
                type: integer
                example: 2
              maxMarks:
                type: number
                format: decimal
                example: 100.00
              examDate:
                type: string
                format: date
                example: "2024-09-05"

    UpdateExam:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          example: "Half Yearly Examination 2024"
        startDate:
          type: string
          format: date
          example: "2024-09-01"
        endDate:
          type: string
          format: date
          example: "2024-09-15"

    AddExamSubject:
      type: object
      required:
        - subjectId
        - maxMarks
      properties:
        subjectId:
          type: integer
          example: 2
        maxMarks:
          type: number
          format: decimal
          example: 100.00
        examDate:
          type: string
          format: date
          example: "2024-09-05"

    UpdateExamSubject:
      type: object
      properties:
        maxMarks:
          type: number
          format: decimal
          example: 100.00
        examDate:
          type: string
          format: date
          example: "2024-09-05"

    # Exam Results related schemas
    ExamResult:
      type: object
      properties:
        id:
          type: integer
          example: 1
        studentId:
          type: integer
          example: 10
        studentName:
          type: string
          example: "John Doe"
        marksObtained:
          type: number
          format: decimal
          nullable: true
          example: 85.50
        grade:
          type: string
          nullable: true
          example: "A"

    EnterMarks:
      type: object
      required:
        - examSubjectId
        - results
      properties:
        examSubjectId:
          type: integer
          example: 1
        results:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - studentId
            properties:
              studentId:
                type: integer
                example: 10
              marksObtained:
                type: number
                format: decimal
                example: 85.50
              grade:
                type: string
                maxLength: 5
                example: "A"
              isAbsent:
                type: boolean
                example: false

paths:
  /auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user and receive JWT token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/ValidationError"

  /auth/profile:
    get:
      tags:
        - Authentication
      summary: Get user profile
      description: Retrieve authenticated user's profile information
      operationId: getProfile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /schools:
    post:
      tags:
        - Schools
      summary: Create school with admin
      description: Create a new school and its admin user (Super Admin only)
      operationId: createSchool
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSchoolRequest"
      responses:
        "201":
          description: School created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          school:
                            $ref: "#/components/schemas/School"
                          admin:
                            $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    get:
      tags:
        - Schools
      summary: Get all schools
      description: Retrieve list of all schools (Super Admin only)
      operationId: getAllSchools
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Schools retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/School"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /schools/{id}:
    get:
      tags:
        - Schools
      summary: Get school by ID
      description: Retrieve school details by ID
      operationId: getSchoolById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: School retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/School"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags:
        - Schools
      summary: Update school
      description: |
        Update school details (Super Admin only).

        **Note:** Changes to subscriptionPlanId and feeTerms are automatically tracked in history tables.
        Historical data is preserved when these fields are updated.
      operationId: updateSchool
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSchoolRequest"
            examples:
              updateSubscriptionPlan:
                summary: Update subscription plan
                value:
                  subscriptionPlanId: 3
                  subscriptionStatus: "active"
              updateFeeTerms:
                summary: Update fee terms
                value:
                  feeTerms: 12
              updateContactInfo:
                summary: Update contact information
                value:
                  contactEmail: "newcontact@abcschool.com"
                  contactPhone: "+9876543210"
      responses:
        "200":
          description: School updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/School"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /teachers:
    post:
      tags:
        - Teachers
      summary: Create teacher
      description: Create a new teacher for the school (School Admin or Accountant)
      operationId: createTeacher
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeacherRequest"
      responses:
        "201":
          description: Teacher created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Teacher"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    get:
      tags:
        - Teachers
      summary: Get all teachers
      description: Retrieve list of all teachers in the school (School Admin or Accountant)
      operationId: getAllTeachers
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Teachers retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Teacher"
        "401":
