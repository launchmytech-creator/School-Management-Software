          type: string
          format: email
          example: "accountant@school.com"
        password:
          type: string
          format: password
          example: "Accountant@123"
        fullName:
          type: string
          example: "John Accountant"
        phone:
          type: string
          example: "1234567890"
        dateOfBirth:
          type: string
          format: date
          example: "1985-06-15"
        gender:
          type: string
          enum: [Male, Female, Other]
          example: "Male"
        address:
          type: string
          example: "456 Oak Avenue"

    UpdateAccountantRequest:
      type: object
      properties:
        fullName:
          type: string
          example: "John Accountant"
        phone:
          type: string
          example: "9876543210"
        dateOfBirth:
          type: string
          format: date
          example: "1985-06-15"
        gender:
          type: string
          enum: [Male, Female, Other]
          example: "Male"
        address:
          type: string
          example: "789 New Street"

    # Parent related schemas
    Parent:
      type: object
      properties:
        id:
