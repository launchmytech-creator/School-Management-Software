      - name: academicYearId
        in: query
        description: Filter by academic year
        required: false
        schema:
          type: integer
        example: 1
    responses:
      "200":
        description: Subject classes retrieved successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Success"
