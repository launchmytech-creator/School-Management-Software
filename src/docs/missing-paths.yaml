                  properties:
                    data:
                      type: array
                      items:
                        $ref: "#/components/schemas/ClassSubject"
      "401":
        $ref: "#/components/responses/Unauthorized"

/class-subjects/{id}:
  get:
    tags:
      - Class Subjects
    summary: Get class subject by ID
    description: Retrieve class subject assignment details by ID (Admin, Accountant, Teacher)
    operationId: getClassSubjectById
    security:
