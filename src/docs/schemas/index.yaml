components:
  schemas:
    # Common schemas
    Error:
      type: object
      required:
        - success
        - errorCode
        - message
      properties:
        success:
          type: boolean
          example: false
        errorCode:
          type: string
          example: "AUTH_001"
        message:
          type: string
          example: "Invalid email or password"
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    Success:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation successful"
        data:
          type: object

    # User related schemas
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: "user@example.com"
        fullName:
          type: string
          example: "John Doe"
        role:
          type: string
          enum: [super_admin, admin, teacher, student, parent, accountant]
          example: "admin"
        schoolId:
          type: integer
          nullable: true
          example: 1
        schoolName:
          type: string
          nullable: true
          example: "ABC School"
        phone:
          type: string
          nullable: true
          example: "+1234567890"
        isActive:
          type: boolean
          example: true

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "admin@school.com"
        password:
          type: string
          format: password
          example: "Admin@123"

    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/Success"
        - type: object
          properties:
            data:
              type: object
              properties:
                token:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                user:
                  $ref: "#/components/schemas/User"

    # School related schemas
    School:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "ABC International School"
        code:
          type: string
          example: "ABC001"
        subscriptionStatus:
          type: string
          enum: [active, suspended, expired, trial]
          example: "active"
        subscriptionEndDate:
          type: string
          format: date
          nullable: true
          example: "2025-12-31"
        contactEmail:
          type: string
          format: email
          example: "contact@abcschool.com"
        contactPhone:
          type: string
          nullable: true
          example: "+1234567890"
        address:
          type: string
          nullable: true
          example: "123 Main Street, City"
        isActive:
          type: boolean
          example: true
        teacherCount:
          type: integer
          example: 25
        studentCount:
          type: integer
          example: 500

    CreateSchoolRequest:
      type: object
      required:
        - school
        - admin
      properties:
        school:
          type: object
          required:
            - name
            - code
            - contactEmail
          properties:
            name:
              type: string
              minLength: 3
              maxLength: 200
              example: "ABC International School"
            code:
              type: string
              minLength: 2
              maxLength: 50
              example: "ABC001"
            contactEmail:
              type: string
              format: email
              example: "contact@abcschool.com"
            contactPhone:
              type: string
              example: "+1234567890"
            address:
              type: string
              example: "123 Main Street, City"
            subscriptionStatus:
              type: string
              enum: [active, trial]
              default: "trial"
            subscriptionEndDate:
              type: string
              format: date
              example: "2025-12-31"
        admin:
          type: object
          required:
            - email
            - password
            - fullName
          properties:
            email:
              type: string
              format: email
              example: "admin@abcschool.com"
            password:
              type: string
              minLength: 8
              example: "Admin@123"
            fullName:
              type: string
              minLength: 3
              maxLength: 150
              example: "School Administrator"
            phone:
              type: string
              example: "+1234567890"

    # Teacher related schemas
    Teacher:
      type: object
      properties:
        id:
          type: integer
          example: 3
        email:
          type: string
          format: email
          example: "teacher@school.com"
        fullName:
          type: string
          example: "Jane Smith"
        role:
          type: string
          example: "teacher"
        phone:
          type: string
          nullable: true
          example: "+1234567890"
        dateOfBirth:
          type: string
          format: date
          nullable: true
          example: "1990-05-15"
        gender:
          type: string
          enum: [Male, Female, Other]
          nullable: true
          example: "Female"
        address:
          type: string
          nullable: true
          example: "456 Oak Avenue, City"
        schoolId:
          type: integer
          example: 1
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00.000Z"

    CreateTeacherRequest:
      type: object
      required:
        - email
        - password
        - fullName
      properties:
        email:
          type: string
          format: email
          example: "teacher@school.com"
        password:
          type: string
          minLength: 8
          example: "Teacher@123"
        fullName:
          type: string
          minLength: 3
          maxLength: 150
          example: "Jane Smith"
        phone:
          type: string
          example: "+1234567890"
        dateOfBirth:
          type: string
          format: date
          example: "1990-05-15"
        gender:
          type: string
          enum: [Male, Female, Other]
          example: "Female"
        address:
          type: string
          example: "456 Oak Avenue, City"

    # Class related schemas
    Class:
      type: object
      properties:
        id:
          type: integer
          example: 1
        schoolId:
          type: integer
          example: 1
        name:
          type: string
          example: "Class 5"
        section:
          type: string
          nullable: true
          example: "A"
        academicYearId:
          type: integer
          example: 1
        yearName:
          type: string
          example: "2024-2025"
        startDate:
          type: string
          format: date
          example: "2024-04-01"
        endDate:
          type: string
          format: date
          example: "2025-03-31"
        defaultFeeAmount:
          type: number
          format: decimal
          nullable: true
          example: 25000.00
        studentCount:
          type: integer
          example: 45

    CreateClassRequest:
      type: object
      required:
        - name
        - academicYearId
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: "Class 5"
        section:
          type: string
          maxLength: 10
          example: "A"
        academicYearId:
          type: integer
          example: 1
        defaultFeeAmount:
          type: number
          format: decimal
          example: 25000.00

    UpdateClassRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: "Class 5"
        section:
          type: string
          maxLength: 10
          example: "B"
        defaultFeeAmount:
          type: number
          format: decimal
          example: 30000.00

    # Student related schemas
    Student:
      type: object
      properties:
        id:
          type: integer
          example: 1
        schoolId:
          type: integer
          example: 1
        admissionNumber:
          type: string
          example: "2024001"
        fullName:
          type: string
          example: "John Doe"
        dateOfBirth:
          type: string
          format: date
          nullable: true
          example: "2010-05-15"
        gender:
          type: string
          enum: [male, female, other]
          nullable: true
          example: "male"
        address:
          type: string
          nullable: true
          example: "123 Main Street"
        phone:
          type: string
          nullable: true
          example: "1234567890"
        admissionDate:
          type: string
          format: date
          example: "2024-04-01"
        currentClassId:
          type: integer
          nullable: true
          example: 1
        className:
          type: string
          nullable: true
          example: "Class 5"
        classSection:
          type: string
          nullable: true
          example: "A"
        parentId:
          type: integer
          nullable: true
          example: 5
        parentName:
          type: string
          nullable: true
          example: "Jane Doe"
        parentPhone:
          type: string
          nullable: true
          example: "9876543210"
        rollNumber:
          type: string
          nullable: true
          example: "01"
        status:
          type: string
          enum: [active, inactive, transferred, graduated]
          example: "active"
        createdAt:
          type: string
          format: date-time
          example: "2024-04-01T10:30:00.000Z"

    CreateStudentRequest:
      type: object
      required:
        - admissionNumber
        - fullName
        - admissionDate
      properties:
        admissionNumber:
          type: string
          minLength: 1
          maxLength: 50
          example: "2024001"
        fullName:
          type: string
          minLength: 3
          maxLength: 150
          example: "John Doe"
        dateOfBirth:
          type: string
          format: date
          example: "2010-05-15"
        gender:
          type: string
          enum: [male, female, other]
          example: "male"
        address:
          type: string
          example: "123 Main Street"
        phone:
          type: string
          example: "1234567890"
        admissionDate:
          type: string
          format: date
          example: "2024-04-01"
        currentClassId:
          type: integer
          example: 1
        parentId:
          type: integer
          example: 5
        rollNumber:
          type: string
          maxLength: 20
          example: "01"
        status:
          type: string
          enum: [active, inactive, transferred, graduated]
          default: "active"
          example: "active"

    UpdateStudentRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 3
          maxLength: 150
          example: "John Doe"
        dateOfBirth:
          type: string
          format: date
          example: "2010-05-15"
        gender:
          type: string
          enum: [male, female, other]
          example: "male"
        address:
          type: string
          example: "123 Main Street"
        phone:
          type: string
          example: "1234567890"
        currentClassId:
          type: integer
          example: 2
        parentId:
          type: integer
          example: 5
        rollNumber:
          type: string
          maxLength: 20
          example: "15"
        status:
          type: string
          enum: [active, inactive, transferred, graduated]
          example: "active"

    # Subject related schemas
    Subject:
      type: object
      properties:
        id:
          type: integer
          example: 1
        schoolId:
          type: integer
          example: 1
        name:
          type: string
          example: "Mathematics"
        code:
          type: string
          example: "MATH"
        chapterCount:
          type: integer
          example: 12

    CreateSubjectRequest:
      type: object
      required:
        - name
        - code
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: "Mathematics"
        code:
          type: string
          minLength: 2
          maxLength: 20
          example: "MATH"

    UpdateSubjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: "Advanced Mathematics"
        code:
          type: string
          minLength: 2
          maxLength: 20
          example: "AMATH"

    # Chapter related schemas
    Chapter:
      type: object
      properties:
        id:
          type: integer
          example: 1
        schoolId:
          type: integer
          example: 1
        subjectId:
          type: integer
          example: 1
        subjectName:
          type: string
          example: "Science"
        subjectCode:
          type: string
          example: "SCI"
        name:
          type: string
          example: "Photosynthesis"
        sequenceNumber:
          type: integer
          nullable: true
          example: 1
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00.000Z"

    CreateChapterRequest:
      type: object
      required:
        - subjectId
        - name
      properties:
        subjectId:
          type: integer
          example: 1
        name:
          type: string
          minLength: 2
          maxLength: 200
          example: "Photosynthesis"
        sequenceNumber:
          type: integer
          example: 1

    UpdateChapterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
          example: "Advanced Photosynthesis"
        sequenceNumber:
          type: integer
          example: 5

    # Academic Year related schemas
    AcademicYear:
      type: object
      properties:
        id:
          type: integer
          example: 1
        schoolId:
          type: integer
          example: 1
        yearName:
          type: string
          example: "2024-2025"
        startDate:
          type: string
          format: date
          example: "2024-04-01"
        endDate:
          type: string
          format: date
          example: "2025-03-31"
        isCurrent:
          type: boolean
          example: true
        classCount:
          type: integer
          example: 12

    CreateAcademicYearRequest:
      type: object
      required:
        - yearName
        - startDate
        - endDate
      properties:
        yearName:
          type: string
          minLength: 4
          maxLength: 20
          pattern: '^\d{4}-\d{4}$'
          example: "2024-2025"
          description: "Format: YYYY-YYYY"
        startDate:
          type: string
          format: date
          example: "2024-04-01"
        endDate:
          type: string
          format: date
          example: "2025-03-31"
          description: "Must be after start date"
        isCurrent:
          type: boolean
          default: false
          example: true

    UpdateAcademicYearRequest:
      type: object
      properties:
        yearName:
          type: string
          minLength: 4
          maxLength: 20
          pattern: '^\d{4}-\d{4}$'
          example: "2024-2025"
        startDate:
          type: string
          format: date
          example: "2024-04-01"
        endDate:
          type: string
          format: date
          example: "2025-03-31"
        isCurrent:
          type: boolean
          example: true

    # Class Subject related schemas
    ClassSubject:
      type: object
      properties:
        id:
          type: integer
          example: 1
        schoolId:
          type: integer
          example: 1
        classId:
          type: integer
          example: 1
        className:
          type: string
          example: "Class 5"
        classSection:
          type: string
          nullable: true
          example: "A"
        subjectId:
          type: integer
          example: 2
        subjectName:
          type: string
          example: "Mathematics"
        subjectCode:
          type: string
          example: "MATH"
        academicYearId:
          type: integer
          example: 1
        yearName:
          type: string
          example: "2024-2025"
        maxMarks:
          type: number
          format: decimal
          nullable: true
          example: 100.00

    AssignSubjectRequest:
      type: object
      required:
        - classId
        - subjectId
        - academicYearId
      properties:
        classId:
          type: integer
          example: 1
        subjectId:
          type: integer
          example: 2
        academicYearId:
          type: integer
          example: 1
        maxMarks:
          type: number
          format: decimal
          example: 100.00

    UpdateClassSubjectRequest:
      type: object
      properties:
        maxMarks:
          type: number
          format: decimal
          example: 150.00

    # Teacher Allocation related schemas
    TeacherAllocation:
      type: object
      properties:
        id:
          type: integer
          example: 1
        schoolId:
          type: integer
          example: 1
        teacherId:
          type: integer
          example: 5
        teacherName:
          type: string
          example: "Jane Smith"
        teacherEmail:
          type: string
          example: "teacher@school.com"
        teacherPhone:
          type: string
          nullable: true
          example: "1234567890"
        classId:
          type: integer
          example: 1
        className:
          type: string
          example: "Class 5"
        classSection:
          type: string
          nullable: true
          example: "A"
        subjectId:
          type: integer
          example: 2
        subjectName:
          type: string
          example: "Mathematics"
        subjectCode:
          type: string
          example: "MATH"
        academicYearId:
          type: integer
          example: 1
        yearName:
          type: string
          example: "2024-2025"
        createdAt:
          type: string
          format: date-time
          example: "2024-03-11T10:30:00.000Z"

    AllocateTeacherRequest:
      type: object
      required:
        - teacherId
        - classId
        - subjectId
        - academicYearId
      properties:
        teacherId:
          type: integer
          example: 5
        classId:
          type: integer
          example: 1
        subjectId:
          type: integer
          example: 2
        academicYearId:
          type: integer
          example: 1

    # Accountant related schemas
    Accountant:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: "accountant@school.com"
        fullName:
          type: string
          example: "John Accountant"
        role:
          type: string
          example: "accountant"
        phone:
          type: string
          nullable: true
          example: "1234567890"
        dateOfBirth:
          type: string
          format: date
          nullable: true
          example: "1985-06-15"
        gender:
          type: string
          enum: [Male, Female, Other]
          nullable: true
          example: "Male"
        address:
          type: string
          nullable: true
          example: "456 Oak Avenue"
        schoolId:
          type: integer
          example: 1
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2024-03-11T10:30:00.000Z"

    CreateAccountantRequest:
      type: object
      required:
        - email
        - password
        - fullName
      properties:
        email:
          type: string
          format: email
          example: "accountant@school.com"
        password:
          type: string
          minLength: 8
          example: "Accountant@123"
        fullName:
          type: string
          minLength: 3
          maxLength: 150
          example: "John Accountant"
        phone:
          type: string
          example: "1234567890"
        dateOfBirth:
          type: string
          format: date
          example: "1985-06-15"
        gender:
          type: string
          enum: [Male, Female, Other]
          example: "Male"
        address:
          type: string
          example: "456 Oak Avenue"

    UpdateAccountantRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 3
          maxLength: 150
          example: "John Accountant"
        phone:
          type: string
          example: "1234567890"
        dateOfBirth:
          type: string
          format: date
          example: "1985-06-15"
        gender:
          type: string
          enum: [Male, Female, Other]
          example: "Male"
        address:
          type: string
          example: "456 Oak Avenue"
        isActive:
          type: boolean
          example: true

    # Fee Structure related schemas
    FeeStructure:
      type: object
      properties:
        id:
          type: integer
          example: 1
        schoolId:
          type: integer
          example: 1
        classId:
          type: integer
          example: 1
        className:
          type: string
          example: "Class 5"
        classSection:
          type: string
          nullable: true
          example: "A"
        academicYearId:
          type: integer
          example: 1
        academicYearName:
          type: string
          example: "2024-2025"
        feeType:
          type: string
          example: "Tuition Fee"
        amount:
          type: number
          format: decimal
          example: 25000.00
        termNumber:
          type: integer
          nullable: true
          example: 1

    CreateFeeStructure:
      type: object
      required:
        - classId
        - academicYearId
        - feeType
        - amount
      properties:
        classId:
          type: integer
          example: 1
        academicYearId:
          type: integer
          example: 1
        feeType:
          type: string
          maxLength: 50
          example: "Tuition Fee"
        amount:
          type: number
          format: decimal
          example: 25000.00
        termNumber:
          type: integer
          minimum: 1
          maximum: 12
          example: 1

    UpdateFeeStructure:
      type: object
      properties:
        amount:
          type: number
          format: decimal
          example: 30000.00
        feeType:
          type: string
          maxLength: 50
          example: "Annual Fee"

    # Fee Transaction related schemas
    FeeTransaction:
      type: object
      properties:
        id:
          type: integer
          example: 1
        schoolId:
          type: integer
          example: 1
        studentId:
          type: integer
          example: 10
        studentName:
          type: string
          example: "John Doe"
        admissionNumber:
          type: string
          example: "2024001"
        className:
          type: string
          example: "Class 5"
        classSection:
          type: string
          nullable: true
          example: "A"
        feeStructureId:
          type: integer
          example: 1
        feeType:
          type: string
          example: "Tuition Fee"
        academicYearId:
          type: integer
          example: 1
        academicYearName:
          type: string
          example: "2024-2025"
        termNumber:
          type: integer
          example: 1
        originalAmount:
          type: number
          format: decimal
          example: 25000.00
        amountDue:
          type: number
          format: decimal
          example: 25000.00
        amountPaid:
          type: number
          format: decimal
          example: 0.00
        waiverAmount:
          type: number
          format: decimal
          example: 0.00
        waiverReason:
          type: string
          nullable: true
          example: "Scholarship"
        waiverApprovedBy:
          type: integer
          nullable: true
          example: 2
        waiverApprovedByName:
          type: string
          nullable: true
          example: "Admin Name"
        dueDate:
          type: string
          format: date
          example: "2024-07-01"
        paymentDate:
          type: string
          format: date
          nullable: true
          example: "2024-06-25"
        status:
          type: string
          enum: [pending, partial, paid]
          example: "pending"
        paymentMode:
          type: string
          enum: [cash, card, upi, cheque, bank_transfer]
          nullable: true
          example: "upi"
        receiptNumber:
          type: string
          nullable: true
          example: "RCP-2024-001"
        collectedBy:
          type: integer
          nullable: true
          example: 3
        collectedByName:
          type: string
          nullable: true
          example: "Accountant Name"
        parentName:
          type: string
          nullable: true
          example: "Jane Doe"
        parentPhone:
          type: string
          nullable: true
          example: "9876543210"
        parentEmail:
          type: string
          nullable: true
          example: "parent@example.com"
        createdAt:
          type: string
          format: date-time
          example: "2024-04-01T10:30:00.000Z"

    GenerateFeeTransactions:
      type: object
      required:
        - feeStructureId
        - academicYearStartDate
      properties:
        feeStructureId:
          type: integer
          example: 1
          description: "Fee structure to use for generating transactions"
        academicYearStartDate:
          type: string
          format: date
          example: "2024-04-01"
          description: "Academic year start date for calculating due dates"

    RecordPayment:
      type: object
      required:
        - amountPaid
        - paymentMode
      properties:
        amountPaid:
          type: number
          format: decimal
          example: 5000.00
          description: "Amount being paid (can be partial)"
        paymentDate:
          type: string
          format: date
          example: "2024-06-25"
        paymentMode:
          type: string
          enum: [cash, card, upi, cheque, bank_transfer]
          example: "upi"
        receiptNumber:
          type: string
