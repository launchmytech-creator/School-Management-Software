/accountants:
  post:
    tags:
    - Accountants
    summary: Create accountant
    description: Create a new accountant for the school (School Admin only)
    operationId: createAccountant
    security:
    - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateAccountantRequest'
          examples:
            fullAccountant:
              summary: Create accountant with all details
              value:
                email: accountant@school.com
                password: Accountant@123
                fullName: John Accountant
                phone: '1234567890'
                dateOfBirth: '1985-06-15'
                gender: Male
                address: 456 Oak Avenue
    responses:
      '201':
        description: Accountant created successfully
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Success'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Accountant'
      '400':
        $ref: '#/components/responses/ValidationError'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
  get:
    tags:
    - Accountants
    summary: Get all accountants
    description: Retrieve list of all accountants in the school (School Admin only)
    operationId: getAllAccountants
    security:
    - BearerAuth: []
    responses:
      '200':
        description: Accountants retrieved successfully
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Success'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Accountant'
      '401':
        $ref: '#/components/responses/Unauthorized'
/accountants/{id}:
  get:
    tags:
    - Accountants
    summary: Get accountant by ID
    description: Retrieve accountant details by ID (School Admin only)
    operationId: getAccountantById
    security:
    - BearerAuth: []
    parameters:
    - $ref: '#/components/parameters/IdPathParam'
    responses:
      '200':
        description: Accountant retrieved successfully
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Success'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Accountant'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '404':
        $ref: '#/components/responses/NotFound'
  patch:
    tags:
    - Accountants
    summary: Update accountant
    description: Update accountant details (School Admin only)
    operationId: updateAccountant
    security:
    - BearerAuth: []
    parameters:
    - $ref: '#/components/parameters/IdPathParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateAccountantRequest'
    responses:
      '200':
        description: Accountant updated successfully
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Success'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Accountant'
      '400':
        $ref: '#/components/responses/ValidationError'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
  delete:
    tags:
    - Accountants
    summary: Deactivate accountant
    description: Deactivate an accountant (School Admin only)
    operationId: deleteAccountant
    security:
    - BearerAuth: []
    parameters:
    - $ref: '#/components/parameters/IdPathParam'
    responses:
      '200':
        description: Accountant deactivated successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Success'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
