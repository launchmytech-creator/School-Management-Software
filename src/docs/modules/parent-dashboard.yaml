# Parent Dashboard endpoints
/parent/dashboard:
  get:
    tags:
      - Parent Dashboard
    summary: Get parent dashboard overview
    description: Get dashboard overview with all children and their quick stats (Parent only)
    operationId: getParentDashboard
    security:
      - BearerAuth: []
    responses:
      "200":
        description: Dashboard overview retrieved successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Success"
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: "#/components/schemas/ParentDashboardOverview"
            examples:
              success:
                summary: Dashboard with two children
                value:
                  success: true
                  message: "Dashboard overview retrieved successfully"
                  data:
                    - student:
                        id: 25
                        admission_number: "STU2024025"
                        full_name: "Rahul Kumar"
                        date_of_birth: "2010-06-15"
                        gender: "male"
                        roll_number: "15"
                        status: "active"
                        class_name: "Class 5"
                        class_section: "A"
                        academic_year: "2024-2025"
                      fee_summary:
                        total_fees: 4
                        paid_fees: 2
                        pending_fees: 2
                        total_due: "12500.00"
                      recent_attendance:
                        - status: "present"
                          attendance_date: "2024-03-12"
                        - status: "present"
                          attendance_date: "2024-03-11"
                        - status: "absent"
                          attendance_date: "2024-03-08"
                        - status: "present"
                          attendance_date: "2024-03-07"
                        - status: "present"
                          attendance_date: "2024-03-06"
                    - student:
                        id: 26
                        admission_number: "STU2024026"
                        full_name: "Priya Kumar"
                        date_of_birth: "2012-08-20"
                        gender: "female"
                        roll_number: "10"
                        status: "active"
                        class_name: "Class 3"
                        class_section: "B"
                        academic_year: "2024-2025"
                      fee_summary:
                        total_fees: 4
                        paid_fees: 4
                        pending_fees: 0
                        total_due: "0.00"
                      recent_attendance:
                        - status: "present"
                          attendance_date: "2024-03-12"
                        - status: "present"
                          attendance_date: "2024-03-11"
                        - status: "present"
                          attendance_date: "2024-03-08"
                        - status: "present"
                          attendance_date: "2024-03-07"
                        - status: "late"
                          attendance_date: "2024-03-06"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"

/parent/children:
  get:
    tags:
      - Parent Dashboard
    summary: Get my children
    description: Get list of all children linked to logged-in parent (Parent only)
    operationId: getMyChildren
    security:
      - BearerAuth: []
    responses:
      "200":
        description: Children retrieved successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Success"
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: "#/components/schemas/ChildDetails"
            examples:
              success:
                summary: List of children
                value:
                  success: true
                  message: "Children retrieved successfully"
                  data:
                    - id: 25
                      admission_number: "STU2024025"
                      full_name: "Rahul Kumar"
                      date_of_birth: "2010-06-15"
                      gender: "male"
                      roll_number: "15"
                      status: "active"
                      phone: "9876543210"
                      class_name: "Class 5"
                      class_section: "A"
                      academic_year: "2024-2025"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"

/parent/children/{childId}/marks:
  get:
    tags:
      - Parent Dashboard
    summary: Get child's marks
    description: View child's exam marks across all subjects and exams (Parent only)
    operationId: getChildMarks
    security:
      - BearerAuth: []
    parameters:
      - name: childId
        in: path
        required: true
        schema:
          type: integer
        description: Child (Student) ID
        example: 25
    responses:
      "200":
        description: Child marks retrieved successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Success"
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: "#/components/schemas/ChildMarks"
            examples:
              success:
                summary: Child's exam marks
                value:
                  success: true
                  message: "Child marks retrieved successfully"
                  data:
                    - id: 150
                      marks_obtained: 85.00
                      grade: "A"
                      is_absent: false
                      max_marks: 100.00
                      exam_date: "2024-02-15"
                      exam_name: "Half Yearly Exam"
                      exam_type: "half_yearly"
                      subject_name: "Mathematics"
                      subject_code: "MATH"
                      class_name: "Class 5"
                      class_section: "A"
                    - id: 151
                      marks_obtained: 78.00
                      grade: "B+"
                      is_absent: false
                      max_marks: 100.00
                      exam_date: "2024-02-16"
                      exam_name: "Half Yearly Exam"
                      exam_type: "half_yearly"
                      subject_name: "Science"
                      subject_code: "SCI"
                      class_name: "Class 5"
                      class_section: "A"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        description: Not authorized to access this child's information
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
            example:
              success: false
              errorCode: "AUTH_005"
              message: "You are not authorized to access this student's information"
      "404":
        $ref: "#/components/responses/NotFound"

/parent/children/{childId}/attendance:
  get:
    tags:
      - Parent Dashboard
    summary: Get child's attendance
    description: View child's attendance records with optional date filtering (Parent only)
    operationId: getChildAttendance
    security:
      - BearerAuth: []
    parameters:
      - name: childId
        in: path
        required: true
        schema:
          type: integer
        description: Child (Student) ID
        example: 25
      - name: startDate
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Filter from this date
        example: "2024-01-01"
      - name: endDate
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Filter until this date
        example: "2024-03-31"
    responses:
      "200":
        description: Child attendance retrieved successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Success"
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: "#/components/schemas/ChildAttendance"
            examples:
              success:
                summary: Child's attendance records
                value:
                  success: true
                  message: "Child attendance retrieved successfully"
                  data:
                    - id: 500
                      attendance_date: "2024-03-12"
                      status: "present"
                      class_name: "Class 5"
                      class_section: "A"
                      marked_by: "Mr. John Teacher"
                    - id: 499
                      attendance_date: "2024-03-11"
                      status: "present"
                      class_name: "Class 5"
                      class_section: "A"
                      marked_by: "Mr. John Teacher"
                    - id: 498
                      attendance_date: "2024-03-08"
                      status: "absent"
                      class_name: "Class 5"
                      class_section: "A"
                      marked_by: "Mr. John Teacher"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/NotFound"

/parent/children/{childId}/attendance-summary:
  get:
    tags:
      - Parent Dashboard
    summary: Get child's attendance summary
    description: Get attendance summary with percentage calculation (Parent only)
    operationId: getChildAttendanceSummary
    security:
      - BearerAuth: []
    parameters:
      - name: childId
        in: path
        required: true
        schema:
          type: integer
        description: Child (Student) ID
        example: 25
      - name: academicYearId
        in: query
        required: false
        schema:
          type: integer
        description: Filter by academic year
        example: 1
    responses:
      "200":
        description: Attendance summary retrieved successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Success"
                - type: object
                  properties:
                    data:
                      $ref: "#/components/schemas/AttendanceSummary"
            examples:
              success:
                summary: Attendance summary with percentage
                value:
                  success: true
                  message: "Attendance summary retrieved successfully"
                  data:
                    total_days: 187
                    present_days: 180
                    absent_days: 5
                    late_days: 2
                    working_days: 215
                    attendance_percentage: "83.72"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/NotFound"

