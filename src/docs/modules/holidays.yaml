paths:
  /api/v1/holidays:
    post:
      tags:
        - Holidays
      summary: Create holiday
      description: Create a new holiday (School Admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHoliday"
      responses:
        "201":
          description: Holiday created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    get:
      tags:
        - Holidays
      summary: Get all holidays
      description: Get all holidays for the school (School Admin, Accountant, or Teacher)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: academicYearId
          schema:
            type: integer
          description: Filter by academic year ID
        - in: query
          name: startDate
          schema:
            type: string
            format: date
          description: Filter by start date (use with endDate)
        - in: query
          name: endDate
          schema:
            type: string
            format: date
          description: Filter by end date (use with startDate)
      responses:
        "200":
          description: Holidays retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/holidays/working-days:
    get:
      tags:
        - Holidays
      summary: Calculate working days
      description: Calculate working days between two dates excluding weekends and holidays (School Admin or Accountant)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: startDate
          required: true
          schema:
            type: string
            format: date
          description: Start date
        - in: query
          name: endDate
          required: true
          schema:
            type: string
            format: date
          description: End date
        - in: query
          name: academicYearId
          schema:
            type: integer
          description: Filter holidays by academic year ID
      responses:
        "200":
          description: Working days calculated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          working_days:
                            type: integer
                            example: 215
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/holidays/{id}:
    get:
      tags:
        - Holidays
      summary: Get holiday by ID
      description: Get a specific holiday (School Admin, Accountant, or Teacher)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Holiday retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags:
        - Holidays
      summary: Update holiday
      description: Update a holiday (School Admin only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHoliday"
      responses:
        "200":
          description: Holiday updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags:
        - Holidays
      summary: Delete holiday
      description: Delete a holiday (School Admin only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Holiday deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
